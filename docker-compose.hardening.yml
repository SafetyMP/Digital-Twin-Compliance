# Phase 6 hardening overlay — Keycloak + OIDC edge + TLS + Jaeger.
# Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.hardening.yml up -d --build
# Direct service ports remain open for Phase 1–4 smokes; OIDC proofs use :8180 / :8443.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8088:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8088"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-digital-twin.json:/opt/keycloak/data/import/realm-digital-twin.json:ro

  oidc-edge:
    build:
      context: ./services/oidc-edge
      dockerfile: Dockerfile
    depends_on:
      - keycloak
      - jaeger
    ports:
      - "8180:8180"
    environment:
      OIDC_JWKS_URL: http://keycloak:8080/realms/digital-twin/protocol/openid-connect/certs
      OIDC_ISSUERS: http://localhost:8088/realms/digital-twin,http://keycloak:8080/realms/digital-twin
      UPSTREAM_STATE: http://state-service:8080/
      UPSTREAM_ALERT: http://alert-service:8085/
      UPSTREAM_AUDIT: http://audit-service:8090/
      UPSTREAM_GRAPH: http://graph-service:8093/
      UPSTREAM_SIMULATION: http://simulation-service:8094/
      UPSTREAM_REPORTING: http://reporting-service:8095/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: oidc-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8180/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tls-edge:
    image: nginx:1.27-alpine
    depends_on:
      - oidc-edge
    ports:
      - "8443:8443"
    volumes:
      - ./infra/nginx/tls-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls/edge.crt:/etc/nginx/certs/edge.crt:ro
      - ./infra/tls/edge.key:/etc/nginx/certs/edge.key:ro

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  reporting-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: reporting-service
